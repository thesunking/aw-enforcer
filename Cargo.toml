[package]
name = "aw-enforcer"
version = "1.0.0"
edition = "2021"
license = "MIT"
build = "build.rs"

[dependencies]
slint = { version = "1.8", features = ["backend-winit", "renderer-femtovg", "raw-window-handle-06"] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
rfd = "0.15"
sysinfo = "0.31"
raw-window-handle = "0.6"
tray-icon = "0.19"
winrt-notification = "0.5"
winreg = "0.52"
dirs = "5.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_Controls",
  "Win32_System_SystemInformation",
  "Win32_System_Shutdown",
  "Win32_System_Threading",
  "Win32_Security"
]

[build-dependencies]
slint-build = "1.8"
winres = "0.1"
